<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rugby en direct</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1d5c36">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f2f4ee;--card:#fff;--tx:#14201a;--mut:#5d6b62;--ac:#1d5c36;--acx:#fff;--live:#d93a26;--bd:#dde2d8;--fr:#1f3f8f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--card:#16201a;--tx:#eef2ec;--mut:#98a89d;--ac:#5fc27f;--acx:#0e1511;--live:#ff6a52;--bd:#27342b;--fr:#7fa2ff}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font:800 28px/1.1 system-ui,sans-serif;margin:8px 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.sub b{color:var(--live)}
nav{display:flex;gap:6px;margin-bottom:10px}
nav button{flex:1;font:600 15px system-ui,sans-serif;padding:9px 6px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
nav button[aria-selected="true"]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
nav.sec button{border-radius:6px;font-weight:400;padding:6px}
nav.sec button[aria-selected="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button:focus-visible{outline:3px solid var(--fr);outline-offset:2px}
h2{font:700 17px system-ui,sans-serif;margin:18px 0 8px;color:var(--mut)}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
.m .t{font-weight:600}.m .t.a{text-align:right}
.sc{font:800 28px/1 system-ui,sans-serif;text-align:center;min-width:92px;font-variant-numeric:tabular-nums}
.sc small{display:block;font:400 13px system-ui,sans-serif;color:var(--mut);margin-top:3px}
.m.live{border-color:var(--live)}.m.live .sc small{color:var(--live);font-weight:600}
.m.up .sc,.m.autre .sc{font-size:20px;color:var(--mut)}
.vide{color:var(--mut);background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:16px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:360px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{font-weight:600;color:var(--mut);font-size:13px}
tr:last-child td{border-bottom:0}td:last-child{font-weight:700}
.qual td:first-child{box-shadow:inset 4px 0 var(--ac)}
h2 small{font-weight:400;font-size:13px;margin-left:6px}
h3.jour{font:600 14px system-ui,sans-serif;color:var(--mut);margin:14px 0 6px;display:block}
h3.jour::first-letter{text-transform:uppercase}
.m.ft .sc small{color:var(--mut)}
.petit{color:var(--mut);font-size:13px;margin:6px 0 0}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.top h1{margin:0}
.actions{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:11px;display:block}
.cloche{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;display:grid;place-items:center;padding:0}
.cloche svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cloche.on{color:var(--ac);border-color:var(--ac)}
.cloche.on svg{fill:currentColor}
.cloche.on::after{content:"";position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--live);border:2px solid var(--card)}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;width:min(300px,100%);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu[hidden]{display:none}
.menu label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.menu select{font:inherit;width:100%;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
.menu select:disabled{opacity:.5}
.aide{margin:0;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<main>
<header class="top">
  <h1>Rugby en direct</h1>
  <div class="actions">
    <button id="cloche" class="cloche" type="button" aria-label="Notification du match en direct" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 9H3c0-1 3-2 3-9z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
    </button>
    <img class="logo" src="/icon-192.png" width="42" height="42" alt="">
  </div>
  <div class="menu" id="menuNotif" hidden>
    <label for="fav">Notification du match en direct</label>
    <select id="fav" disabled><option value="">Chargement…</option></select>
    <p class="aide" id="notifMsg"></p>
  </div>
</header>
<p class="sub" id="statut">Chargement…</p>
<nav id="comp" role="tablist" aria-label="Compétition"></nav>
<nav id="vue" class="sec" role="tablist" aria-label="Vue"></nav>
<section id="out" aria-live="polite"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
